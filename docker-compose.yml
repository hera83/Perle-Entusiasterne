# Fast, selvstændig opsætning: Frontend + Backend + PostgreSQL.
# Ingen .env-fil nødvendig - alle værdier er sat direkte herunder.
# Rediger værdierne i denne fil direkte hvis de skal ændres (fx til produktion).
#
# Usage:
#   docker compose up --build
#   docker compose down
#   docker compose down -v   (nulstil database)

name: perleplade

services:

  app:
    build:
      context: .
      args:
        - VITE_LOCAL_API_URL=
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: ./server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: perleplade
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: local-dev-secret-change-in-production
      JWT_EXPIRY: 24h
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: perleplade
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./server/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
